[project]
name = "surnet-guardian"
version = "0.2.0"
description = "Desktop network discovery, service fingerprinting, exposure analysis, local listener audit and Windows firewall control"
requires-python = ">=3.12,<3.13"
dependencies = [
  "customtkinter>=5.2,<6",
  "psutil>=6,<8",
  "SQLAlchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
