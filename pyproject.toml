[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surnet-guardian"
version = "0.3.0"
description = "Windows-first network guardian with device inventory, monitoring, alerts, exposure analysis and local port protection"
requires-python = ">=3.12,<3.13"
dependencies = [
  "customtkinter>=5.2,<6",
  "psutil>=6,<8",
  "SQLAlchemy>=2.0,<3",
  "cryptography>=43,<47",
  "pystray>=0.19,<1",
  "Pillow>=10,<13",
]

[project.gui-scripts]
surnet-guardian = "app.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.setuptools.packages.find]
include = ["app*"]
